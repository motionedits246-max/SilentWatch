name: SilentWatch CI & Windows NSIS Build

on:
  push:
    branches: [silentwatch-gemini, main]
  pull_request:
    branches: [silentwatch-gemini, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core-checks:
    name: Rust Core (Clippy & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy on core crates
        run: cargo clippy --workspace --exclude silentwatch-desktop --all-targets
      - name: Run Rust workspace unit tests
        run: cargo test --workspace --exclude silentwatch-desktop

  frontend-checks:
    name: Frontend (Typecheck, Vitest, Vite Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Run Vitest component & interaction tests
        run: npm test
      - name: Production Vite build
        run: npm run build

  windows-tauri-build:
    name: Windows NSIS Installer Build
    runs-on: windows-latest
    needs: [rust-core-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate SilentWatch desktop icons
        run: |
          pip install pillow
          python scripts/generate-icons.py
      - name: Install frontend dependencies
        run: npm install
      - name: Run Windows Rust collector & core tests
        run: cargo test --workspace --exclude silentwatch-desktop
      - name: Build SilentWatch Windows NSIS installer (.exe)
        run: npx tauri build --bundles nsis
      - name: Upload Windows NSIS Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: silentwatch-windows-nsis-installer
          path: target/release/bundle/nsis/*.exe
