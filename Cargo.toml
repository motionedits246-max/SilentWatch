[workspace]
resolver = "2"
members = [
    "crates/silentwatch-core",
    "crates/silentwatch-collectors",
    "crates/silentwatch-storage",
    "crates/silentwatch-rules",
    "crates/silentwatch-ipc",
    "crates/silentwatch-installer",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "sync", "time", "macros"] }
regex = "1.11"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
sysinfo = "0.32"
ureq = { version = "2.10", features = ["json"] }
