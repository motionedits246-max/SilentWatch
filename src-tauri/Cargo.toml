[package]
name = "silentwatch-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "silentwatch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
uuid.workspace = true
silentwatch-core = { path = "../crates/silentwatch-core" }
silentwatch-collectors = { path = "../crates/silentwatch-collectors" }
silentwatch-storage = { path = "../crates/silentwatch-storage" }
silentwatch-rules = { path = "../crates/silentwatch-rules" }
silentwatch-ipc = { path = "../crates/silentwatch-ipc" }
